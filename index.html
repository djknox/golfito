<!doctype html>
<html lang="en" data-swapped="false">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>golfito</title>

  <!-- Google Font: Shrikhand -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    :root{
      --color-a: #ff6d00; /* orange (text initially) */
      --color-b: #007f06; /* green (background initially) */
    }

    /* Base reset */
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0}
    html{height:100dvh; /* modern mobile viewport support; better for mobile browser UI changes */}

    /* Color states applied to the root element so whole-viewport swaps */
    html[data-swapped="false"]{background:var(--color-b);color:var(--color-a)}
    html[data-swapped="true"] {background:var(--color-a);color:var(--color-b)}

    /* Full-viewport center using flex */
    body{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Shrikhand', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Fullscreen button acts as the interactive region */
    button#app{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      cursor:pointer; /* indicates interactivity for pointer users */
      touch-action:manipulation; /* improve touch responsiveness */
      background:transparent;
      border:none;
      padding:0;
      margin:0;
      font:inherit; /* inherit font so child h1 uses same font */
      color:inherit;
    }

    /* Visible focus indicator for keyboard users */
    button#app:focus-visible{
      outline:3px solid rgba(255,255,255,0.9);
      outline-offset:8px;
    }

    h1{
      margin:0;
      line-height:1;
      white-space:nowrap;
      /* Responsive font that adapts to both width and height to avoid clipping */
      font-size:clamp(2rem, min(11.5vw, 22dvh), 18rem);
      letter-spacing: 0.02em;
      user-select:none;
    }

    /* Ensure no scrollbars from default oversize content */
    html,body,#app{overflow:hidden}
  </style>
</head>
<body>
  <button id="app" type="button" aria-pressed="false" aria-label="Toggle colors">
    <h1>golfito</h1>
  </button>

  <script>
    (function(){
      const root = document.documentElement;
      const app = document.getElementById('app');

      function setSwapped(swapped){
        root.setAttribute('data-swapped', String(Boolean(swapped)));
        app.setAttribute('aria-pressed', String(Boolean(swapped)));
      }

      function toggle(){
        const current = root.getAttribute('data-swapped') === 'true';
        setSwapped(!current);
      }

      // Use native button click to handle mouse, touch, and keyboard activation consistently
      app.addEventListener('click', () => {
        toggle();
      });

      // Limit keyboard adjustments to the button element; prevent Space from scrolling when focused
      app.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
        }
      });

      // Initialize ARIA state
      setSwapped(root.getAttribute('data-swapped') === 'true');
    })();
  </script>
</body>
</html>
